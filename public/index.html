<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050d09">
<title>La Pacita Pickle Hub – Book a Court</title>
<link rel="icon" type="image/jpeg" href="/assets/logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css"></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const H=[...Array(16)].map((_,i)=>i+6),fmt=h=>(h%12||12)+':00 '+(h<12?'AM':'PM'),peso=n=>'₱'+Number(n||0).toLocaleString();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=async(p,m='GET',b)=>{const r=await fetch('/api/'+p,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined}),j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Something went wrong');return j};
let C={courts:[],pay:{}},me=null,S={v:'home',tab:'bk',f:{court:'',date:today(),hour:null},draft:null,done:null,err:'',q:'',st:'',data:[],payIdx:0};
const R=()=>{$('#app').innerHTML=nav()+(S.v=='home'?home():S.v=='login'?login():dash());if(S.v=='home')slots()};
const nav=()=>`<nav><div class="brand" onclick="location.hash='';S.v='home';R()" style="cursor:pointer"><img src="/assets/logo.jpg" alt="La Pacita Pickle Hub" class="nav-logo"></div><div>${me?`<button class="y sm" onclick="dash0()">Dashboard</button><button class="sm" onclick="logout()">Logout</button>`:`<button class="y sm" onclick="location.hash='';S.v='home';R()">Book</button><button class="sm" onclick="S.v='login';S.err='';R()">Staff Login</button>`}</div></nav>`;
function home(){return`<div class="hero"><div class="hero-particles"><span></span><span></span><span></span><span></span><span></span></div><img src="/assets/logo.jpg" alt="La Pacita Pickle Hub" class="hero-logo"><p class="hero-tag">Reserve your court &middot; Play under the sun <span class="hero-emoji">🏓</span></p></div>
<div class="wrap"><div class="card">${S.draft&&!S.done?payCard():S.done?`<div class="ok">Booking request sent! Your code:<b>${esc(S.done.ref)}</b>${esc(S.done.court)} · ${esc(S.done.date)} · ${fmt(S.done.hour)}<br>Payment submitted – awaiting staff confirmation<br><br><button onclick="S.done=null;R()">Book another</button></div>`:form()}</div>
<div class="card"><h3>CHECK MY BOOKING</h3><div class="row"><input id="lk" placeholder="Booking code e.g. LP-1A2B3C"><button onclick="look()">Check</button></div><p id="lr" class="note"></p></div></div>`}
function form(){return`<h3>BOOK A COURT</h3><div class="grid"><div><label>Court</label><select onchange="S.f.court=+this.value;S.f.hour=null;slots()">${C.courts.map(c=>`<option value="${c.id}" ${c.id==S.f.court?'selected':''}>${esc(c.name)} – ${peso(c.rate)}/hr</option>`).join('')}</select></div><div><label>Date</label><input type="date" min="${today()}" value="${S.f.date}" onchange="S.f.date=this.value||today();S.f.hour=null;slots()"></div></div>
<label style="margin-top:12px">Pick a time (1 hour) — crossed-out slots are taken</label><div class="slots" id="sl"></div>
<div class="grid"><div><label>Full name</label><input id="bn"></div><div><label>Mobile number</label><input id="bp" type="tel"></div><div><label>Email</label><input id="be" type="email"></div><div><label>Players</label><input id="bq" type="number" min="1" max="8" value="4"></div></div>
<p class="err" id="be2">${esc(S.err)}</p><button class="y" onclick="book()">${C.mode=='manual'?'Continue to payment':'Pay with GCash'}</button>`}
async function slots(){const el=$('#sl');if(!el)return;let t=[];try{t=(await api(`slots?court=${S.f.court}&date=${S.f.date}`)).taken}catch(e){}
 el.innerHTML=H.map(h=>{const x=t.includes(h)||(S.f.date==today()&&h<=new Date().getHours());return`<button class="slot ${x?'x':''} ${S.f.hour==h?'sel':''}" ${x?'disabled':''} onclick="S.f.hour=${h};slots()">${fmt(h)}</button>`}).join('')}
function book(){const v=i=>$('#'+i).value.trim(),e=v('be'),q=+v('bq');let m='';
 if(!v('bn')||!v('bp'))m='Please enter your name and mobile number.';else if(S.f.hour==null)m='Please pick a time slot.';else if(!/^\S+@\S+\.\S+$/.test(e))m='Please enter a valid email.';else if(!(q>=1&&q<=8))m='Players must be 1–8.';
 if(m){$('#be2').textContent=m;return}
 S.draft={name:v('bn'),phone:v('bp'),email:e,court:S.f.court,date:S.f.date,hour:S.f.hour,players:q};S.err='';C.mode=='manual'?R():submit()}
function payCard(){const d=S.draft,c=C.courts.find(x=>x.id==d.court),amt=Math.round(c.rate*C.pay.dp/100),qrs=C.pay.qrcodes||[];
 return`<h3>CHOOSE PAYMENT METHOD</h3><p><b>${esc(c.name)}</b> · ${esc(d.date)} · ${fmt(d.hour)}</p><div class="ok"><span class="note">Amount to pay${C.pay.dp<100?' ('+C.pay.dp+'% downpayment)':''}</span><b>${peso(amt)}</b></div>
${qrs.length?`<div class="pay-methods">${qrs.map((q,i)=>`<button class="pay-method ${S.payIdx==i?'active':''}" onclick="S.payIdx=${i};R()">${esc(q.label)}</button>`).join('')}</div>
<div class="qr-display"><img src="${qrs[S.payIdx].img}" alt="${esc(qrs[S.payIdx].label)} QR" class="qr-img"><p class="qr-label">${esc(qrs[S.payIdx].label)}</p></div>`:'<p class="note" style="text-align:center;margin:16px 0">No payment QR codes set up yet.</p>'}
<div style="text-align:center;margin:6px 0"><b>${esc(C.pay.gname)}</b><br>${esc(C.pay.gnum)}</div>
<ol class="note"><li>Open your payment app → Scan the QR and pay the exact amount.</li><li>Provide <b>either</b> the reference number <b>or</b> a screenshot below.</li></ol>
<label>Payment reference no. (Optional if screenshot uploaded)</label><input id="gr" inputmode="numeric">
<label style="margin-top:12px">Upload receipt screenshot (Optional if ref no. entered)</label><input type="file" accept="image/*" id="gimg" onchange="if(this.files[0]) shrink(this.files[0],800,0.8).then(r=>S.draft.receipt=r)">
<p class="err" id="ge"></p><button class="gh" onclick="S.draft=null;S.payIdx=0;R()">Back</button> <button class="y" onclick="submit()">I've paid – submit</button>`}
async function submit(){try{const r=await api('book','POST',{...S.draft,gref:$('#gr')?.value});if(r.url)return location.href=r.url;S.done=r;S.draft=null;S.f.hour=null;R()}
 catch(e){S.err=e.message;const el=$('#ge')||$('#be2');if(el)el.textContent=e.message;else{S.draft=null;R()}}}
async function look(r){r=r||$('#lk').value.trim();try{const b=await api('booking/'+encodeURIComponent(r));$('#lr').innerHTML=`<b>${esc(b.ref)}</b> · ${esc(b.court)} · ${esc(b.date)} ${fmt(b.hour)} · <span class="b ${b.status}">${b.status}</span>`}catch(e){$('#lr').textContent=e.message}}
const login=()=>`<div class="wrap"><div class="card login"><div class="ribbon">STAFF LOGIN</div><label>Email</label><input id="le"><label style="margin-top:8px">Password</label><input id="lpw" type="password"><p class="err">${esc(S.err)}</p><button class="y" onclick="doLogin()">Sign in</button></div></div>`;
async function doLogin(){try{me=await api('login','POST',{email:$('#le').value,password:$('#lpw').value});dash0()}catch(e){S.err=e.message;R()}}
async function logout(){await api('logout','POST');me=null;S.v='home';location.hash='';R()}
async function dash0(){location.hash='dash';S.v='dash';tab('bk')}
async function tab(t){S.tab=t;try{S.data=await api({bk:'admin/bookings',ct:'admin/courts',ad:'admin/users',se:'admin/settings'}[t])}catch(e){me=null;S.v='login';S.err=e.message}R()}
function dash(){const sa=me.role=='super',T=[['bk','Bookings'],...(sa?[['ct','Courts'],['ad','Admins'],['se','Settings']]:[])];
 return`<div class="wrap" style="margin-top:20px"><div class="card"><h3>${sa?'SUPER ADMIN':'ADMIN'} · ${esc(me.name)}</h3><div class="tabs">${T.map(t=>`<button class="${S.tab==t[0]?'on':''}" onclick="tab('${t[0]}')">${t[1]}</button>`).join('')}</div>${({bk,ct,ad,se})[S.tab](sa)}</div></div>`}
function bk(sa){const B=S.data,d=today();return`<div class="stats"><div class="stat"><b>${B.filter(b=>b.date==d).length}</b>Today</div><div class="stat"><b>${B.filter(b=>b.status=='Pending').length}</b>To accept</div><div class="stat"><b>${B.filter(b=>b.status=='Accepted').length}</b>Accepted</div>${sa?`<div class="stat"><b>${peso(B.filter(b=>b.status=='Accepted').reduce((s,b)=>s+b.amount,0))}</b>Accepted revenue</div>`:''}</div>
<div class="row"><input placeholder="Search name, code, phone" value="${esc(S.q)}" oninput="S.q=this.value;tb()"><select onchange="S.st=this.value;tb()">${['','Pending','Accepted','Unpaid','Rejected','Cancelled','Refund'].map(s=>`<option ${S.st==s?'selected':''} value="${s}">${s||'All statuses'}</option>`).join('')}</select></div><div class="tw" id="tb" style="margin-top:10px">${tbl(sa)}</div>`}
function tb(){$('#tb').innerHTML=tbl(me.role=='super')}
function tbl(sa){const q=S.q.toLowerCase(),L=S.data.filter(b=>(!S.st||b.status==S.st)&&(!q||(b.name+b.ref+b.phone).toLowerCase().includes(q)));
 return`<table><tr><th>Code</th><th>Player</th><th>Court</th><th>When</th><th>Payment</th><th>Status</th><th></th></tr>${L.map(b=>`<tr><td>${esc(b.ref)}</td><td>${esc(b.name)}<br><span class="note">${esc(b.phone)} · ${b.players} pax</span></td><td>${esc(b.cname)}</td><td>${esc(b.date)}<br>${fmt(b.hour)}</td><td>${peso(b.amount)}<br><span class="note">${esc(b.gref||(b.paid?'PayMongo':''))}</span>${b.receipt?`<br><a onclick="viewRec('${b.receipt}')" class="note" style="cursor:pointer;color:var(--primary);text-decoration:underline">View Receipt</a>`:''}</td><td><span class="b ${b.status}">${b.status}</span></td><td>${b.status=='Pending'?`<button class="sm" onclick="st('${b.ref}','Accepted')">Accept</button>`:''}${sa&&b.status=='Pending'?` <button class="sm r" onclick="st('${b.ref}','Rejected')">Reject</button>`:''}${sa&&b.status=='Accepted'?`<button class="sm r" onclick="st('${b.ref}','Cancelled')">Cancel</button>`:''}${sa&&b.status=='Refund'?`<button class="sm gh" onclick="st('${b.ref}','Cancelled')">Close</button>`:''}</td></tr>`).join('')||'<tr><td colspan="7" class="note">No bookings found.</td></tr>'}</table>`}
async function st(r,s){try{await api(`admin/bookings/${r}/status`,'POST',{status:s});tab('bk')}catch(e){alert(e.message)}}
const ct=()=>`<div class="tw"><table><tr><th>Court</th><th>Rate / hr (₱)</th><th>Active</th><th></th></tr>${S.data.map(c=>`<tr><td><input value="${esc(c.name)}" onchange="uc(${c.id},'name',this.value)"></td><td><input type="number" min="0" value="${c.rate}" onchange="uc(${c.id},'rate',+this.value)"></td><td><input type="checkbox" style="width:auto" ${c.active?'checked':''} onchange="uc(${c.id},'active',this.checked)"></td><td style="text-align:right"><button class="sm r" onclick="ask('Delete this court?', ()=>api('admin/courts/${c.id}','DELETE').then(()=>tab('ct')))">Delete</button></td></tr>`).join('')}</table></div><button style="margin-top:12px" onclick="api('admin/courts','POST',{}).then(()=>tab('ct'))">+ Add court</button>`;
async function uc(id,k,v){const c=S.data.find(x=>x.id==id);c[k]=v;await api('admin/courts/'+id,'PUT',c)}
const ad=()=>`<div class="row"><div><label>Name</label><input id="an"></div><div><label>Email</label><input id="ae" type="email"></div><div><label>Temp password (8+)</label><input id="ap"></div><div><label>&nbsp;</label><button class="y" style="width:100%" onclick="addAd()">Create admin</button></div></div><p class="err">${esc(S.err)}</p>
<div class="tw"><table><tr><th>Name</th><th>Email</th><th>Status</th><th></th></tr>${S.data.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td><span class="b ${u.active?'Accepted':'Rejected'}">${u.active?'Active':'Off'}</span></td><td><button class="sm gh" onclick="ua(${u.id},{active:${!u.active}})">${u.active?'Deactivate':'Activate'}</button> <button class="sm gh" onclick="pw(${u.id})">Reset password</button> <button class="sm r" onclick="ask('Delete this admin?', ()=>api('admin/users/${u.id}','DELETE').then(()=>tab('ad')))">Delete</button></td></tr>`).join('')}</table></div>`;
async function addAd(){try{await api('admin/users','POST',{name:$('#an').value.trim(),email:$('#ae').value.trim(),password:$('#ap').value});S.err='';tab('ad')}catch(e){S.err=e.message;R()}}
async function ua(id,b){await api('admin/users/'+id,'PUT',b);tab('ad')}
function pw(id){const p=prompt('New password (8+ characters):');if(p)ua(id,{password:p}).catch(e=>alert(e.message))}
const se=()=>{const s=S.data;let qrcodes=[];try{qrcodes=JSON.parse(s.qrcodes||'[]')}catch(e){}return`<div class="grid"><div><label>Account name</label><input value="${esc(s.gname)}" onchange="sv('gname',this.value)"></div><div><label>Account number</label><input value="${esc(s.gnum)}" onchange="sv('gnum',this.value)"></div><div><label>Payment required</label><select onchange="sv('dp',+this.value)">${[100,50,30].map(x=>`<option value="${x}" ${s.dp==x?'selected':''}>${x==100?'Full payment':x+'% downpayment'}</option>`).join('')}</select></div></div>
<h3 style="margin-top:20px">PAYMENT QR CODES</h3><p class="note">Add QR codes for each payment method you accept (GCash, Maya, Bank, etc.). Customers will choose which one to use.</p>
<div id="qr-list">${qrcodes.map((q,i)=>`<div class="qr-card"><div class="qr-card-header"><input value="${esc(q.label)}" placeholder="Label e.g. GCash" onchange="updQR(${i},'label',this.value)"><button class="sm r" onclick="delQR(${i})">Remove</button></div>${q.img?`<img src="${q.img}" class="qr-preview">`:''}<input type="file" accept="image/*" onchange="upQRFile(${i},this.files[0])"></div>`).join('')||'<p class="note">No QR codes added yet.</p>'}</div>
<button style="margin-top:12px" onclick="addQR()">+ Add QR code</button>`};
function getQRCodes(){try{return JSON.parse(S.data.qrcodes||'[]')}catch(e){return[]}}
async function addQR(){const qrs=getQRCodes();qrs.push({label:'',img:''});await sv('qrcodes',JSON.stringify(qrs));tab('se')}
async function delQR(i){const qrs=getQRCodes();qrs.splice(i,1);await sv('qrcodes',JSON.stringify(qrs));tab('se')}
async function updQR(i,k,v){const qrs=getQRCodes();qrs[i][k]=v;await sv('qrcodes',JSON.stringify(qrs));tab('se')}
async function upQRFile(i,f){const img=await shrink(f,600,.92);if(!img)return;const qrs=getQRCodes();qrs[i].img=img;await sv('qrcodes',JSON.stringify(qrs));tab('se')}
const sv=(k,v)=>api('admin/settings','PUT',{[k]:v}).then(()=>api('config').then(c=>C=c));
const shrink=(f,m,q)=>new Promise(r=>{if(!f)return r('');const i=new Image;i.onload=()=>{const k=Math.min(1,m/i.width),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',q))};i.onerror=()=>r('');i.src=URL.createObjectURL(f)});
const viewRec = img => { const d = document.createElement('div'); d.innerHTML = '<div style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);z-index:9999;display:flex;align-items:center;justify-content:center;cursor:zoom-out" onclick="this.remove()"><img src="'+img+'" style="max-width:90%;max-height:90%;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,0.5)"></div>'; document.body.appendChild(d.firstChild); };
const ask = (msg, cb) => { const m = document.createElement('div'); m.innerHTML = `<div style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);z-index:9999;display:flex;align-items:center;justify-content:center"><div class="card" style="padding:24px;max-width:320px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,0.5)"><h3 style="margin:0 0 20px">${msg}</h3><div class="row" style="margin-top:24px"><button class="gh" id="ask-no">Cancel</button> <button class="r" id="ask-yes">Delete</button></div></div></div>`; const el = m.firstChild; document.body.appendChild(el); $('#ask-no').onclick = () => el.remove(); $('#ask-yes').onclick = () => { el.remove(); cb(); }; };
(async()=>{C=await api('config');S.f.court=C.courts[0]?.id;try{me=await api('me');if(location.hash==='#dash')return dash0()}catch(e){}R();const p=new URLSearchParams(location.search);if(p.get('paid'))look(p.get('paid'));if(p.get('cancel'))$('#lr').textContent='Payment was cancelled. Your slot is held for 10 minutes; book again if needed.'})();
</script></body></html>
